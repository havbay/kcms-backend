services:
  - type: web
    name: kcms-backend
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn kcms.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        fromDatabase:
          name: kcms-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: https://kcms-frontend.vercel.app,http://127.0.0.1:5173
      - key: PUBLIC_FRONTEND_URL
        value: https://kcms-frontend.vercel.app
      - key: META_GRAPH_VERSION
        value: v26.0
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_LOGIN_CONFIG_ID
        sync: false
      - key: META_OAUTH_REDIRECT_URI
        value: https://kcms-backend.onrender.com/api/v1/facebook/oauth/callback
      - key: META_OAUTH_SCOPES
        value: pages_show_list,pages_read_engagement,pages_read_user_content,pages_manage_engagement,pages_manage_metadata
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false

databases:
  - name: kcms-postgres
    plan: free
