name = "findmoy-api-staging"
main = "src/worker.py"
compatibility_date = "2026-09-16"
compatibility_flags = ["python_workers"]
workers_dev = true

[observability]
enabled = true

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "06135a74fcc84b26ba7b4f8997e41839"

[vars]
CORS_ORIGINS = "https://staging.findmoy.app"
DATABASE_CONNECT_TIMEOUT_SECONDS = "3"
PUBLIC_FRONTEND_URL = "https://staging.findmoy.app"
RUN_MIGRATIONS_ON_STARTUP = "false"
RUN_QUARANTINE_SWEEP = "false"
META_GRAPH_VERSION = "v26.0"
META_OAUTH_REDIRECT_URI = "https://api-staging.findmoy.app/api/v1/facebook/oauth/callback"
META_OAUTH_SCOPES = "pages_show_list,pages_read_engagement,pages_read_user_content,pages_manage_engagement,pages_manage_metadata"
SENTRY_ENVIRONMENT = "staging"

[secrets]
required = ["INTEGRATION_ENCRYPTION_KEY"]
